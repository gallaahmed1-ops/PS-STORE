<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ألعاب بلايستيشن</title>
    <style>
         :root {
            --primary: #003791;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        
        header {
            background-color: var(--primary);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            margin: 0;
            font-size: 26px;
        }
        
        .creator {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #d1e0ff;
            font-weight: 500;
        }
        
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .games-section {
            flex: 2;
            min-width: 300px;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .filter-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: auto;
            margin-top: 0;
        }
        
        .filter-btn:hover {
            background-color: #555;
        }
        
        .filter-btn.active {
            background-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 55, 145, 0.5);
        }
        
        .search-container {
            margin-bottom: 20px;
        }
        
        #search-input {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--surface);
            color: white;
            border: 1px solid #444;
            border-radius: 25px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        
        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 55, 145, 0.4);
        }
        
        .cart-section {
            flex: 1;
            min-width: 300px;
            background-color: var(--surface);
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .card {
            background-color: var(--surface);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
            position: relative;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .game-size-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffcc00;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #444;
            z-index: 2;
        }
        
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #222;
        }
        
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .tag.ps4 {
            background-color: #003791;
        }
        
        .tag.ps3 {
            background-color: #000000;
            border: 1px solid #333;
        }
        
        .btn-container {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        button.add-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
        }
        
        button.add-btn:hover {
            background-color: #00225c;
        }
        
        button.details-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: 0.3s;
        }
        
        button.details-btn:hover {
            background-color: #666;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .delivery-options {
            margin: 20px 0;
        }
        
        .delivery-options label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        #address-container {
            display: none;
            margin-top: 10px;
        }
        
        textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }
        
        .whatsapp-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        
        .whatsapp-btn:hover {
            background-color: #128C7E;
        }
        
        .request-game-section {
            width: 100%;
            background-color: var(--surface);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }
        
        .request-game-section p {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #ffcc00;
        }
        
        .request-btn {
            width: auto;
            padding: 12px 30px;
            font-size: 18px;
            display: inline-block;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .modal-content {
            background-color: var(--surface);
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
        }
        
        .modal-content img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #222;
        }
        
        .modal-content h2 {
            margin: 15px 0 5px 0;
            font-size: 22px;
        }
        
        .modal-content p {
            color: #ccc;
            line-height: 1.6;
            font-size: 15px;
            margin: 15px 0 20px 0;
            text-align: justify;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        
        .close-btn:hover {
            background: #ff4444;
        }
    </style>
</head>

    <div class="container">

                <button id="btn-PS3" class="filter-btn" onclick="filterGames('PS3')">ألعاب PS3</button>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="🔍 ابحث عن اسم اللعبة هنا..." oninput="renderGames()">
            </div>

            <div class="grid" id="games-grid">
            </div>
        </div>

        <div class="cart-section">
            <h2>🛒 سلة المشتريات</h2>
            <div id="cart-items">

            </div>

            <hr style="border-color: #333; margin: 20px 0;">

            <div class="delivery-options">
                <h3>طريقة الاستلام:</h3>

                <label><input type="radio" name="delivery" value="delivery" onchange="toggleAddress()"> توصيل إلى عنواني</label>
            </div>

            <div id="address-container">

                <textarea id="address" rows="3" placeholder="اكتب اسم الشارع، رقم العمارة، المدينة..."></textarea>
            </div>

            <button class="whatsapp-btn" onclick="sendToWhatsApp()">إتمام الطلب عبر واتساب 💬</button>
        </div>

        <div class="request-game-section">
            <p>لو عايز لعبة مش موجودة، بلغنا علطول علشان نحاول نوفرهالك في أسرع وقت!</p>
            <button class="whatsapp-btn request-btn" onclick="requestMissingGame()">تواصل معنا لطلب لعبتك 💬</button>
        </div>
    </div>

            </div>
            <p id="modal-desc"></p>
            <button class="add-btn" id="modal-add-btn" style="width: 100%">أضف للسلة</button>
        </div>
    </div>

        let cart = [];

        function renderGames() {
            const grid = document.getElementById('games-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const searchInput = document.getElementById('search-input');
            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';

            const filteredGames = gamesList.filter(game => {
                const matchesPlatform = (currentPlatform === 'All' || game.platform === currentPlatform);
                const matchesSearch = game.name.toLowerCase().includes(searchQuery);
                return matchesPlatform && matchesSearch;
            });

            if (filteredGames.length === 0) {
                grid.innerHTML = '<p style="color: #888; padding: 20px;">لا توجد ألعاب تطابق بحثك حالياً.</p>';
                return;
            }

            filteredGames.forEach(game => {
                const tagClass = game.platform.toLowerCase();
                const localImagePath = `images/${game.id}.jpg`;
                const gameSize = game.size || "غير محدد";

                const card = `
                    <div class="card">
                        <span class="game-size-badge">💾 ${gameSize}</span>
                        <img src="${localImagePath}" alt="${game.name}" onerror="this.onerror=null; this.src='https://placehold.co/200x250/333/fff?text=${encodeURIComponent(game.name)}'">
                        <h3 style="font-size: 16px; margin: 10px 0;">${game.name}</h3>
                        <span class="tag ${tagClass}">${game.platform}</span>
                        <div class="btn-container">
                            <button class="add-btn" onclick="addToCart(${game.id})">أضف للسلة</button>
                            <button class="details-btn" onclick="showDetails(${game.id})">تفاصيل</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function showDetails(id) {
            const game = gamesList.find(g => g.id === id);
            if (game) {
                const modal = document.getElementById('details-modal');
                const modalImg = document.getElementById('modal-img');
                const modalTitle = document.getElementById('modal-title');
                const modalTag = document.getElementById('modal-tag');
                const modalSize = document.getElementById('modal-size');
                const modalDesc = document.getElementById('modal-desc');
                const modalAddBtn = document.getElementById('modal-add-btn');

                if (modalImg) {
                    modalImg.src = `images/${game.id}.jpg`;
                    modalImg.onerror = function() {
                        this.onerror = null;
                        this.src = `https://placehold.co/200x250/333/fff?text=${encodeURIComponent(game.name)}`;
                    };
                }

                if (modalTitle) modalTitle.innerText = game.name;
                if (modalTag) {
                    modalTag.innerText = game.platform;
                    modalTag.className = `tag ${game.platform.toLowerCase()}`;
                }
                if (modalSize) modalSize.innerText = `💾 ${game.size || 'غير محدد'}`;
                if (modalDesc) modalDesc.innerText = game.description || "لا تتوفر تفاصيل إضافية عن هذه اللعبة حالياً.";

                if (modalAddBtn) modalAddBtn.setAttribute('onclick', `addToCart(${game.id}); closeDetails();`);
                if (modal) modal.style.display = 'flex';
            }
        }

        function closeDetails() {
            const modal = document.getElementById('details-modal');
            if (modal) modal.style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('details-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        function filterGames(platform) {
            currentPlatform = platform;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + platform);
            if (activeBtn) activeBtn.classList.add('active');
            renderGames();
        }

        function addToCart(id) {
            const game = gamesList.find(g => g.id === id);
            if (!cart.find(item => item.id === id)) {
                cart.push(game);
                updateCartUI();
            } else {
                alert("هذه اللعبة موجودة بالفعل في السلة!");
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            if (!cartContainer) return;
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #888;">السلة فارغة حالياً.</p>';
                return;
            }

            cartContainer.innerHTML = '';
            cart.forEach(item => {
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name} <small style="color:#aaa;">(${item.platform})</small></span>
                        <span style="color: #ff4444; cursor: pointer; font-weight: bold;" onclick="removeFromCart(${item.id})">X</span>
                    </div>
                `;
            });
        }

        function toggleAddress() {
            const deliveryInput = document.querySelector('input[name="delivery"]:checked');
            const addressContainer = document.getElementById('address-container');
            if (deliveryInput && deliveryInput.value === 'delivery') {
                if (addressContainer) addressContainer.style.display = 'block';
            } else {
                if (addressContainer) addressContainer.style.display = 'none';
            }
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("برجاء اختيار لعبة واحدة على الأقل لإتمام الطلب!");
                return;
            }

            let message = "*مرحباً، أود طلب الألعاب التالية:*\n\n";
            cart.forEach((item, index) => {
                message += `${index + 1}- ${item.name} [${item.platform}]\n`;
            });

            const selectedDelivery = document.querySelector('input[name="delivery"]:checked');
            if (!selectedDelivery) {
                alert("برجاء اختيار طريقة الاستلام!");
                return;
            }
            const deliveryOption = selectedDelivery.value;

            if (deliveryOption === 'pickup') {
                message += "\n*طريقة الاستلام:* سأقوم بالاستلام من مقر المتجر 🏪";
            } else {
                const addressElement = document.getElementById('address');
                const addressText = addressElement ? addressElement.value.trim() : "";
                if (addressText === "") {
                    alert("برجاء كتابة العنوان بالتفصيل!");
                    return;
                }
                message += `\n*طريقة الاستلام:* توصيل 🚚\n*العنوان:* ${addressText}`;
            }

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodedMessage}`, '_blank');
        }

        function requestMissingGame() {
            const message = "*مرحباً، كنت أبحث عن لعبة غير موجودة في المتجر وأريد أن أطلب توفيرها لي:* \n\n (اكتب اسم اللعبة هنا: )";
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodedMessage}`, '_blank');
        }

        renderGames();
    </script>
